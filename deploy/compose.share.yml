name: musify-share

# Temporary overlay for exposing the stack outside the LAN, on top of
# compose.dev.yml. Only difference from a normal dev run: Zitadel writes its
# init PAT to a separate host directory, so it never overwrites
# zitadel/.output (used by the musify-dev project's own Zitadel instance).
#
#   docker compose --env-file deploy/.env.share \
#     -f deploy/compose.yml -f deploy/compose.dev.yml -f deploy/compose.share.yml \
#     --profile apps up -d --build api gateway web-player

services:
  zitadel:
    volumes:
      - ./zitadel/.output-share:/output
