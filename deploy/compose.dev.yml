name: musify-dev

# Development overlay: publishes Musify's own ports to the host so the .NET
# apps and the web player can run from the IDE.
#
#   docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up -d
#   docker compose -f deploy/compose.yml -f deploy/compose.dev.yml --profile apps up -d --build
#
# Postgres/Zitadel/SeaweedFS/RabbitMQ/Jaeger ports come from Infrastructure's
# own compose.dev.yml, not from here. See ../../../Infrastructure/README.md.
# `host.docker.internal` resolves to the same address from the browser, from
# apps on the host and from inside these containers, which is what makes the
# OIDC issuer and the presigned S3 URLs valid in both run modes. `extra_hosts`
# gives Linux containers that same name.

x-host-alias: &host-alias
  - "host.docker.internal:host-gateway"

services:
  wait-for-postgres:
    extra_hosts: *host-alias

  seaweedfs-init:
    extra_hosts: *host-alias

  # zitadel-init (compose.yml) edits whichever env file is mounted here.
  zitadel-init:
    extra_hosts: *host-alias
    volumes:
      - ./.env:/workspace/.env

  migrate:
    extra_hosts: *host-alias

  api:
    ports:
      - "5111:5111"
    extra_hosts: *host-alias

  worker:
    extra_hosts: *host-alias

  gateway:
    ports:
      - "8081:8081"
    extra_hosts: *host-alias

  web-player:
    ports:
      - "3000:3000"
    extra_hosts: *host-alias
